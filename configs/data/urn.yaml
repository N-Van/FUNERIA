_target_: src.data.one_urn_datamodule.OneUrnDataModule
filename: ${paths.data_dir}/urne_640.tif
ground_truth_filename: ${paths.data_dir}/urne_truth_640.tif
slice_jump: 1
slice_image_size: null
# do not set the parameter to keep all the urn in one batch
slice_batch_size:
  20 # Needs to be divisible by the number of devices (e.g., if in a distributed setup).
  # ideally an even number of slice per batch would be good, so
  # the pairwise slice number can be computed in each batch
train_val_test_split: [0, 0, 1]
use_25d_image: True
num_workers: 0
pin_memory: False
