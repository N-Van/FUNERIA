[workspace]
authors = ["Convolutio <79534557+Convolutio@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "FUNERIA"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.10.*"

[pypi-dependencies]
# --------- Image ---------- #
ultralytics = "*"
opencv-python = "*"
pillow = "*"
tifffile = "*"
scikit-image = "*"
# --------- pytorch --------- #
torch = ">=2.0.0"
torchvision = ">=0.15.0"
lightning = ">=2.0.0"
torchmetrics = ">=0.11.4"
# --------- hydra --------- #
hydra-core = "==1.3.2"
hydra-colorlog = "==1.2.0"
hydra-optuna-sweeper = "==1.2.0"
# --------- loggers --------- #
mlflow = "*"
codecarbon = "*"
# --------- others --------- #
rootutils = "*"   # standardizing the project root setup
rich = "*"        # beautiful text formatting in terminal
tqdm = "*"        # progress bars
pandas = "*"      # data manipulation
ipykernel = "*"   # for adding the environment in jupyter

[feature.dev.pypi-dependencies]
pre-commit = "*"  # hooks for applying linters on commit
pytest = "*"      # tests
black = "*"       # formatting

[feature.napari.dependencies]
python = "3.11.*"
pyqt = "*"
napari = "*"

[feature.docs.dependencies]
zensical = "*"

[environments]
dev = ["dev", "docs"]
docs = { features = ["docs"], no-default-feature = true }
napari = { features = ["napari"], no-default-feature = true }
