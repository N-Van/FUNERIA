[workspace]
authors = ["Convolutio <79534557+Convolutio@users.noreply.github.com>", "N-Van <92249658+N-Van@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "FUNERIA"
platforms = [
  { platform = "linux-64", cuda = "12.4" },
  { platform = "win-64", cuda = "12.4" },
]
version = "0.1.0"

[tasks]

[activation]
env = { PYTHONNOUSERSITE = "1" }

[dependencies]
python = "3.10.*"
# --------- Image ---------- #
ultralytics = "*"
opencv = "*"
pillow = "*"
tifffile = "*"
scikit-image = "*"
# --------- pytorch --------- #
pytorch-gpu = ">=2.0.0"
torchvision = ">=0.15.0"
lightning = ">=2.0.0"
torchmetrics = ">=0.11.4"
# --------- hydra --------- #
hydra-core = "==1.3.2"
hydra-colorlog = "==1.2.0"
# --------- loggers --------- #
mlflow = "*"
codecarbon = "*"
# --------- others --------- #
rich = "*"        # beautiful text formatting in terminal
tqdm = "*"        # progress bars
pandas = "*"      # data manipulation
ipykernel = "*"   # for adding the environment in jupyter

[pypi-dependencies]
hydra-optuna-sweeper = "==1.2.0"
rootutils = "*"   # standardizing the project root setup

[feature.dev.dependencies]
pre-commit = "*"  # hooks for applying linters on commit
pytest = "*"      # tests
black = "*"       # formatting

[feature.napari.dependencies]
python = "3.11.*"
pyqt = "*"
napari = "*"

[feature.docs.dependencies]
zensical = "*"

[environments]
dev = ["dev", "docs"]
docs = { features = ["docs"], no-default-feature = true }
napari = { features = ["napari"], no-default-feature = true }
